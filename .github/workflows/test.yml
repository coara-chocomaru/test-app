name: Build DEX from Java

on:
  push:
    branches: [ "main3", "master" ]
  pull_request:
    branches: [ "main3", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;34.0.0
            platforms;android-22
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Generate dummy component classes
        run: |
          python3 generate_dummies.py

      - name: Copy custom SetBackupAccountActivity (overwrite generated one)
        run: |
          cp SetBackupAccountActivity.java src/com/google/android/backup/

      - name: Compile all Java files
        run: |
          ANDROID_JAR=$ANDROID_HOME/platforms/android-22/android.jar
          mkdir -p out
          find src -name "*.java" > sources.txt
          javac -cp $ANDROID_JAR -source 1.8 -target 1.8 -d out @sources.txt

      - name: Convert .class to .dex using d8
        run: |
          D8=$ANDROID_HOME/build-tools/34.0.0/d8
          find out -name "*.class" > classes.txt
          $D8 --lib $ANDROID_HOME/platforms/android-22/android.jar --output . @classes.txt

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex
          if-no-files-found: error

      - name: Show DEX info
        run: |
          ls -lh classes.dex
          file classes.dex
          head -c 32 classes.dex | xxd
