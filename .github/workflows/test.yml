name: Build DEX from Java

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:    # 手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 必要最小限のプラットフォームとビルドツールをインストール
          packages: >-
            platform-tools
            build-tools;34.0.0
            platforms;android-21

      - name: Compile Java to .class
        run: |
          # android.jar のパス（API 21 を使用）
          ANDROID_JAR=$ANDROID_HOME/platforms/android-21/android.jar
          javac -cp $ANDROID_JAR -source 1.8 -target 1.8 YouTubeApplication.java

      - name: Convert .class to .dex using d8
        run: |
          # d8 は build-tools のバージョン指定ディレクトリ内に存在
          D8=$ANDROID_HOME/build-tools/34.0.0/d8
          $D8 --lib $ANDROID_HOME/platforms/android-21/android.jar --output . YouTubeApplication.class

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex
          if-no-files-found: error

      - name: (Optional) Show DEX info
        run: |
          ls -lh classes.dex
          file classes.dex
          head -c 32 classes.dex | xxd
