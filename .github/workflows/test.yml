name: Build DEX from Java

on:
  push:
    branches: [ "test2", "master" ]
  pull_request:
    branches: [ "test2", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK for Android 4.2
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;34.0.0
            platforms;android-17
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Generate dummy component classes
        run: |
          python3 generate_dummies.py

      - name: Compile all Java files
        run: |
          ANDROID_JAR=$ANDROID_HOME/platforms/android-17/android.jar
          mkdir -p out

          find src -name "*.java" > sources.txt

          javac \
            -cp "$ANDROID_JAR" \
            -source 1.8 \
            -target 1.8 \
            -d out \
            @sources.txt

      - name: Convert .class to .dex using d8
        run: |
          D8=$ANDROID_HOME/build-tools/34.0.0/d8

          find out -name "*.class" > classes.txt

          "$D8" \
            --lib "$ANDROID_HOME/platforms/android-17/android.jar" \
            --min-api 17 \
            --output . \
            @classes.txt

      - name: Verify DEX
        run: |
          ls -lh classes.dex
          file classes.dex
          echo "DEX header:"
          head -c 32 classes.dex | xxd

      - name: Upload DEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: classes.dex
          path: classes.dex
          if-no-files-found: error
